<title>Glowmere Valley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fullscreen WebGL canvas; a small start card that hides once you enter. */
:root {
  --void: #050d12; --ink: #e8f6f4; --muted: #8fb4b6;
  --teal: #5ff0d0; --violet: #a98bff;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#panel { position: fixed; inset: 0; display: grid; place-items: end start; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-bottom, 0px)); }
#card { pointer-events: auto; max-width: 26rem; width: 100%; box-sizing: border-box; padding: 1.4rem 1.5rem;
  background: rgba(5, 16, 22, .66); backdrop-filter: blur(10px); border: 1px solid rgba(95, 240, 208, .2); border-radius: 12px; }
h1 { font: 700 clamp(1.8rem, 6vw, 2.5rem)/1 var(--font-display); margin: 0 0 .5rem; letter-spacing: -.02em; color: var(--teal); }
p { margin: .35rem 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1rem; }
button { font: 600 1rem var(--font-display); border: 0; border-radius: 9px; padding: .75rem 1.2rem; min-height: 44px; cursor: pointer; }
#vrBtn { background: linear-gradient(90deg, var(--teal), var(--violet)); color: #04141a; }
#deskBtn { background: transparent; color: var(--ink); border: 1px solid rgba(95, 240, 208, .4); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
#status { font-size: .84rem; margin-top: .8rem; min-height: 1.2em; color: var(--muted); }
#hint { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom, 0px)); text-align: center;
  font-size: .85rem; color: var(--muted); pointer-events: none; }
</style>

<canvas id="gl"></canvas>
<div id="panel">
  <div id="card">
    <h1>Glowmere Valley</h1>
    <p>A misty night valley with sculpted rocks, trees, swaying grass, a glowing pond and drifting spores. Environment test only, no game.</p>
    <p>In VR: left stick walks, right stick turns.</p>
    <div class="row">
      <button id="vrBtn" disabled>Enter VR</button>
      <button id="deskBtn">Explore on screen</button>
    </div>
    <div id="status" role="status">Checking for VR support…</div>
  </div>
</div>
<div id="hint" hidden>WASD to walk. Drag to look.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const FOG_HEX = 0x0b2c35;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ---------- terrain math ----------
  const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y) => { let s = 0, a = .5; for (let i = 0; i < 4; i++) { s += vnoise(x, y) * a; x *= 2.03; y *= 2.03; a *= .5; } return s; };
  const POND = { x: -13, z: -12 }, WATER_Y = -1.2;
  function height(x, z) {
    const r = Math.hypot(x, z);
    let h = ((fbm(x * .045 + 10, z * .045) - .42) * 11 + (vnoise(x * .25, z * .25) - .5) * .5) * smooth(4, 20, r);
    const d2 = (x - POND.x) ** 2 + (z - POND.z) ** 2;
    const w = Math.min(1, Math.exp(-d2 / (2 * 5.5 * 5.5)) * 1.15);
    h = h * (1 - w) + (-2.6 + (vnoise(x * .4, z * .4) - .5) * .3) * w;
    return h;
  }

  // ---------- renderer / scene ----------
  const canvas = $('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.xr.enabled = true; renderer.xr.setFoveation(0.5);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(FOG_HEX, 0.045);
  const camera = new THREE.PerspectiveCamera(70, 1, .05, 300);
  const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
  rig.position.set(0, 0, 9); camera.position.y = 1.65;
  function resize() {
    if (renderer.xr.isPresenting) return;
    renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // soft glow sprite texture
  const glowTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  })();

  // ---------- sky, moon, stars ----------
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = vP.y;
        vec3 hor = vec3(.043,.173,.208), mid = vec3(.02,.07,.11), top = vec3(.008,.02,.04);
        vec3 c = h > 0. ? mix(hor, mix(mid, top, smoothstep(.1,.8,h)), smoothstep(0.,.35,h)) : hor;
        gl_FragColor = vec4(c, 1.);
      }`
  }));
  sky.renderOrder = -2; scene.add(sky);
  const moonDir = new THREE.Vector3(-.32, .42, -.85).normalize();
  const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x9fd8ff, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
  moonGlow.scale.setScalar(70); moonGlow.position.copy(moonDir).multiplyScalar(120); scene.add(moonGlow);
  const moonDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xf2fbff, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
  moonDisc.scale.setScalar(11); moonDisc.position.copy(moonDir).multiplyScalar(120); scene.add(moonDisc);
  const stars = (() => {
    const n = 900, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const u = Math.random() * .85 + .12, t = Math.random() * 6.283, r = Math.sqrt(1 - u * u);
      p.set([Math.cos(t) * r * 140, u * 140, Math.sin(t) * r * 140], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfe6ff, size: .55, fog: false, transparent: true, opacity: .75 }));
  })();
  scene.add(stars);

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0x5fa0b8, 0x0a1a14, .8));
  const moonLight = new THREE.DirectionalLight(0x9fd0ff, 1.2); moonLight.position.copy(moonDir).multiplyScalar(50); scene.add(moonLight);

  // ================= procedural PBR textures =================
  const mod = (a, n) => ((a % n) + n) % n;
  function pn(x, y, px, py) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(mod(xi, px), mod(yi, py)), b = hash(mod(xi + 1, px), mod(yi, py));
    const c = hash(mod(xi, px), mod(yi + 1, py)), d = hash(mod(xi + 1, px), mod(yi + 1, py));
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function pfbm(u, v, px, py, oct) {
    let s = 0, a = .5, f = 1, tot = 0;
    for (let o = 0; o < oct; o++) { s += pn(u * px * f, v * py * f, px * f, py * f) * a; tot += a; a *= .5; f *= 2; }
    return s / tot;
  }
  function makeTex(kind, size = 256) {
    const H = new Float32Array(size * size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size; let h;
      if (kind === 'ground') { h = pfbm(u, v, 8, 8, 5); h = h * .93 + hash(x, y) * .05; }
      else if (kind === 'rock') {
        const n = pfbm(u, v, 5, 5, 5), rid = 1 - Math.abs(2 * n - 1);
        h = rid * rid * .8 + .2 * pfbm(u + .3, v + .1, 16, 16, 3) + .08 * Math.sin((v + n * .3) * 6.283 * 7);
      } else { const n = pfbm(u, v, 4, 28, 4); h = n * .8 + .2 * Math.abs(Math.sin(n * 12 + u * 40)); }  // bark: long vertical grain
      H[y * size + x] = h;
    }
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = size; return c; };
    const ca = mk(), cn = mk(), ga = ca.getContext('2d'), gn = cn.getContext('2d');
    const ia = ga.createImageData(size, size), inn = gn.createImageData(size, size);
    const S = kind === 'ground' ? 14 : kind === 'rock' ? 30 : 26;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const i = y * size + x, h = H[i];
      const dx = H[y * size + (x + 1) % size] - H[y * size + (x + size - 1) % size], dy = H[((y + 1) % size) * size + x] - H[((y + size - 1) % size) * size + x];
      let nx = -dx * S, ny = -dy * S, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      inn.data.set([(nx * .5 + .5) * 255, (ny * .5 + .5) * 255, (nz * .5 + .5) * 255, 255], i * 4);
      const g = (kind === 'rock' ? .28 + h * .7 : .3 + h * .62) * 255;
      ia.data.set([g, g * (kind === 'bark' ? .96 : 1), g * (kind === 'ground' ? .95 : 1), 255], i * 4);
    }
    ga.putImageData(ia, 0, 0); gn.putImageData(inn, 0, 0);
    const alb = new THREE.CanvasTexture(ca), nrm = new THREE.CanvasTexture(cn);
    alb.colorSpace = THREE.SRGBColorSpace;
    for (const t of [alb, nrm]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; }
    return { alb, nrm };
  }
  const tx = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
  const T = { ground: makeTex('ground'), rock: makeTex('rock'), bark: makeTex('bark') };

  // ================= helpers: seeded rng, 3D noise, geometry merge =================
  const seeded = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hash3 = (x, y, z) => { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); };
  function vn3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf), L = (a, b, t) => a + (b - a) * t;
    return L(L(L(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), L(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
             L(L(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), L(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w);
  }
  const fbm3 = (x, y, z) => (vn3(x, y, z) * .55 + vn3(x * 2.1, y * 2.1, z * 2.1) * .3 + vn3(x * 4.3, y * 4.3, z * 4.3) * .15);
  function mergeGeos(list) {
    const attrs = ['position', 'normal', 'uv', 'color'], out = {};
    attrs.forEach(a => out[a] = []);
    list.forEach(g0 => {
      const g = g0.index ? g0.toNonIndexed() : g0, n = g.attributes.position.count;
      attrs.forEach(a => {
        const at = g.attributes[a], size = a === 'uv' ? 2 : 3;
        if (at) out[a].push(...at.array); else out[a].push(...new Array(n * size).fill(a === 'color' ? 1 : 0));
      });
    });
    const m = new THREE.BufferGeometry();
    attrs.forEach(a => m.setAttribute(a, new THREE.BufferAttribute(new Float32Array(out[a]), a === 'uv' ? 2 : 3)));
    return m;
  }
  const srgb = new THREE.Color();
  const setCol = (arr, i, r, g, b) => { srgb.setRGB(r, g, b, THREE.SRGBColorSpace); arr[i * 3] = srgb.r; arr[i * 3 + 1] = srgb.g; arr[i * 3 + 2] = srgb.b; };

  // ================= placement (before terrain so ground can be tinted by it) =================
  const treeSpots = [];
  for (let tries = 0; tries < 3000 && treeSpots.length < 210; tries++) {
    const x = rnd(-68, 68), z = rnd(-68, 68), r = Math.hypot(x, z);
    if (r < 10) continue;
    const y = height(x, z); if (y < WATER_Y + .5) continue;
    if (Math.hypot(x - POND.x, z - POND.z) < 9) continue;
    treeSpots.push([x, y, z]);
  }
  const floraSpots = [];
  for (let tries = 0; tries < 2000 && floraSpots.length < 320; tries++) {
    const x = rnd(-42, 42), z = rnd(-42, 42), r = Math.hypot(x, z);
    if (r < 2.5 || Math.hypot(x - POND.x, z - POND.z) < 4) continue;
    const y = height(x, z); if (y < WATER_Y + .1) continue;
    floraSpots.push([x, y, z]);
  }
  const palette = [[.2, 1, .85], [.55, .45, 1], [.35, 1, .55], [.2, .7, 1]];

  // ================= terrain =================
  const TS = 150, SEG = 130;
  const tGeo = new THREE.PlaneGeometry(TS, TS, SEG, SEG); tGeo.rotateX(-Math.PI / 2);
  const tp = tGeo.attributes.position;
  for (let i = 0; i < tp.count; i++) tp.setY(i, height(tp.getX(i), tp.getZ(i)));
  tGeo.computeVertexNormals();
  {
    const col = new Float32Array(tp.count * 3), nm = tGeo.attributes.normal;
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i), slope = 1 - nm.getY(i);
      const n = fbm(x * .15, z * .15), n2 = vnoise(x * 1.3, z * 1.3);
      let r = .03 + n * .05, g = .10 + n * .15, b = .09 + n * .10;                // moss
      const wet = smooth(.2, -1.6, y); r *= 1 - wet * .5; g += wet * .03; b += wet * .06;   // wet banks
      const rock = smooth(.18, .5, slope + (n2 - .5) * .08);                      // rocky slopes
      r += (.13 - r) * rock; g += (.17 - g) * rock; b += (.19 - b) * rock;
      let ao = .75 + .25 * smooth(-2.8, 1.5, y) * (1 - slope * .6);               // hollows are darker
      for (const t of treeSpots) { const d = Math.hypot(x - t[0], z - t[2]); if (d < 1.6) ao *= .55 + .45 * d / 1.6; }   // dark under trees
      r *= ao; g *= ao; b *= ao;
      for (const f of floraSpots) {                                               // glow from flora bounces onto the ground
        const dx = x - f[0], dz = z - f[2]; if (dx > 3.2 || dx < -3.2 || dz > 3.2 || dz < -3.2) continue;
        const d = Math.hypot(dx, dz); if (d > 3.2) continue; const k = (1 - d / 3.2) ** 2 * .22, pc = palette[floraSpots.indexOf(f) % 4];
        r += pc[0] * k * .5; g += pc[1] * k * .5; b += pc[2] * k * .5;
      }
      const cd = Math.hypot(x, z); if (cd < 7) { const k = (1 - cd / 7) ** 2 * .28; g += k * .8; b += k * .8; r += k * .25; }   // crystal glow
      setCol(col, i, Math.min(r, 1), Math.min(g, 1), Math.min(b, 1));
    }
    tGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  }
  const terrMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, map: tx(T.ground.alb, 46, 46), normalMap: tx(T.ground.nrm, 46, 46), normalScale: new THREE.Vector2(.6, .6) });
  terrMat.onBeforeCompile = sh => {   // second, finer texture scale layered over the first
    sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>',
      'vec4 d1 = texture2D( map, vMapUv ); vec4 d2 = texture2D( map, vMapUv * 6.37 + vec2(.31,.77) ); diffuseColor.rgb *= d1.rgb * d2.rgb * 1.5;');
  };
  scene.add(new THREE.Mesh(tGeo, terrMat));

  // ================= water =================
  const waterMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uFog: { value: new THREE.Color(FOG_HEX) }, uDensity: { value: .045 }, uMoon: { value: moonDir } },
    vertexShader: 'varying vec3 wP; void main(){ vec4 w = modelMatrix*vec4(position,1.); wP = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
    fragmentShader: `varying vec3 wP; uniform float uTime, uDensity; uniform vec3 uFog, uMoon;
      void main(){
        vec2 p = wP.xz;
        float r1 = sin(p.x*1.7+uTime*.8)+sin(p.y*2.1-uTime*.6)+sin((p.x+p.y)*3.1+uTime*1.3)*.5;
        vec2 gr = vec2(cos(p.x*1.7+uTime*.8)*1.7 + cos((p.x+p.y)*3.1+uTime*1.3)*1.5, cos(p.y*2.1-uTime*.6)*2.1 + cos((p.x+p.y)*3.1+uTime*1.3)*1.5);
        vec3 n = normalize(vec3(-gr.x*.03, 1., -gr.y*.03));
        vec3 v = normalize(cameraPosition - wP);
        float f = pow(1. - max(dot(n, v), 0.), 3.);
        vec3 deep = vec3(.01,.06,.08), sky = vec3(.08,.28,.34);
        vec3 col = mix(deep, sky, f*.9+.1);
        vec3 refl = reflect(-v, n);
        float moon = pow(max(dot(refl, normalize(uMoon)), 0.), 220.);
        col += vec3(.7,.9,1.) * moon * 2.5;
        float glow = smoothstep(.4, 1., sin(r1*2.)*.5+.5) * .05; col += vec3(.2,.9,.8) * glow;
        float d = length(cameraPosition - wP);
        float fogF = 1. - exp(-uDensity*uDensity*d*d);
        col = mix(col, uFog, fogF);
        gl_FragColor = vec4(col, .88);
      }`
  });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), waterMat);
  water.rotation.x = -Math.PI / 2; water.position.set(POND.x, WATER_Y, POND.z); scene.add(water);

  // ================= trees: three variants with root flare, branches, drooping tiers =================
  function buildTree(seed, tiers) {
    const rng = seeded(seed);
    const trunk = new THREE.CylinderGeometry(.07, .24, 7.4, 10, 7, true); trunk.translate(0, 3.7, 0);
    const tp2 = trunk.attributes.position, tc = new Float32Array(tp2.count * 3);
    for (let i = 0; i < tp2.count; i++) {
      let x = tp2.getX(i), y = tp2.getY(i), z = tp2.getZ(i);
      const flare = 1 + 1.1 * Math.exp(-y * 2.2), wob = 1 + (hash(Math.round(x * 50) + seed, Math.round(y * 9) + Math.round(z * 50)) - .5) * .18;
      x = x * flare * wob + Math.sin(y * .55 + seed) * .12 * (y / 7); z = z * flare * wob;
      tp2.setXYZ(i, x, y, z);
      const k = .85 + .3 * hash(i, seed), ao = .45 + .55 * smooth(0, 1.6, y);
      setCol(tc, i, .09 * k * ao, .08 * k * ao, .075 * k * ao);
    }
    trunk.setAttribute('color', new THREE.BufferAttribute(tc, 3)); trunk.computeVertexNormals();
    const parts = [trunk];
    for (let k = 0; k < 7; k++) {   // branch stubs
      const b = new THREE.CylinderGeometry(.012, .05, 1.2, 5, 1, true); b.translate(0, .6, 0);
      const bc = new Float32Array(b.attributes.position.count * 3); for (let i = 0; i < bc.length / 3; i++) setCol(bc, i, .08, .07, .065);
      b.setAttribute('color', new THREE.BufferAttribute(bc, 3));
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rng() * 6.28, 0)).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -(.9 + rng() * .5))));
      b.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(0, 1.3 + rng() * 4, 0), q, new THREE.Vector3(1, 1, 1)));
      parts.push(b);
    }
    const trunkGeo = mergeGeos(parts);
    const fol = [];
    for (let i = 0; i < tiers; i++) {
      const f = i / (tiers - 1), R = 2.1 * Math.pow(1 - f, .85) + .45, H = 2.3 - f * .5, y0 = 1.9 + f * 4.6;
      const g = new THREE.ConeGeometry(R, H, 12, 2, true), p = g.attributes.position, c = new Float32Array(p.count * 3);
      for (let j = 0; j < p.count; j++) {

  { const d = new THREE.Object3D(), c = new THREE.Color();

  function bladeGeo() {   // tapered 3-row blade, 1 unit tall

})();
